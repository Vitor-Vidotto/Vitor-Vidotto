<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 145" width="100%">
  <style>
    .bg { fill: #1e1e2e; rx: 10px; }
    .term-header { fill: #181825; rx: 10px; }
    .dot-red { fill: #f38ba8; }
    .dot-yellow { fill: #f9e2af; }
    .dot-green { fill: #a6e3a1; }
    .ascii {
      font-family: 'Courier New', Consolas, monospace;
      font-size: 13px;
      font-weight: bold;
      white-space: pre;
    }
    .line-1 { fill: #cba6f7; animation: pulse 2.5s ease-in-out infinite alternate; }
    .line-2 { fill: #f5c2e7; animation: pulse 2.5s ease-in-out 0.4s infinite alternate; }
    .line-3 { fill: #89b4fa; animation: pulse 2.5s ease-in-out 0.8s infinite alternate; }
    .subtitle {
      font-family: 'Courier New', Consolas, monospace;
      font-size: 13px;
      font-weight: bold;
      fill: #a6e3a1;
    }
    .cursor {
      animation: blink 0.8s steps(2, start) infinite;
      fill: #a6e3a1;
    }
    @keyframes pulse {
      0% { opacity: 0.75; }
      100% { opacity: 1; filter: drop-shadow(0 0 6px #cba6f7); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
  
  <!-- Outer Window Container -->
  <rect class="bg" width="100%" height="100%" />
  
  <!-- Terminal Window Bar -->
  <path d="M 0 0 L 720 0 L 720 28 L 0 28 Z" class="term-header" />
  <circle class="dot-red" cx="20" cy="14" r="5" />
  <circle class="dot-yellow" cx="36" cy="14" r="5" />
  <circle class="dot-green" cx="52" cy="14" r="5" />
  <text x="360" y="18" fill="#a6adc8" font-family="monospace" font-size="11" text-anchor="middle">vitor@dev-terminal:~</text>

  <!-- ASCII Art Body -->
  <g transform="translate(30, 48)">
    <text class="ascii line-1" x="0" y="0">  _   _ _ _                   _   _ _     _       _   _   _     </text>
    <text class="ascii line-1" x="0" y="14"> | | | (_) |_ ___  _ __      | | | (_) __| | ___ | |_| |_ ___  </text>
    <text class="ascii line-2" x="0" y="28"> | | | | | __/ _ \| '__|____ | | | | |/ _` |/ _ \| __| __/ _ \ </text>
    <text class="ascii line-2" x="0" y="42"> \ \_/ / | || (_) | | |_____|| |_| | | (_| | (_) | |_| || (_) |</text>
    <text class="ascii line-3" x="0" y="56">  \___/|_|\__\___/|_|         \___/|_|\__,_|\___/ \__|\__\___/ </text>
    
    <text class="subtitle" x="0" y="80">&gt; Computer Engineer | Analytics &amp; Intelligent Automation <tspan class="cursor">█</tspan></text>
  </g>
</svg>
