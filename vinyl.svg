<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%">
  <style>
    .bg { fill: #0b0b0e; rx: 12px; stroke: #2a080c; stroke-width: 1.5; }
    
    /* Vinyl Spin Animation */
    .vinyl-disc {
      transform-origin: 75px 80px;
      animation: spin 5s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* Equalizer Animation (Dracula Blood Red Vibe) */
    .eq-bar {
      fill: #ff1a3c;
      animation: bounce 1.2s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 4px #ff1a3c);
    }
    .eq-1 { animation-delay: 0.1s; fill: #e60026; }
    .eq-2 { animation-delay: 0.4s; fill: #ff2a4b; }
    .eq-3 { animation-delay: 0.2s; fill: #ff4d6d; }
    .eq-4 { animation-delay: 0.5s; fill: #990011; }
    .eq-5 { animation-delay: 0.3s; fill: #ff1a3c; }

    @keyframes bounce {
      0% { height: 6px; y: 114px; }
      100% { height: 28px; y: 92px; }
    }

    .title {
      font-family: 'Courier New', Consolas, monospace;
      font-size: 16px;
      font-weight: bold;
      fill: #ffffff;
      filter: drop-shadow(0 0 2px #ff1a3c);
    }
    .artist {
      font-family: 'Courier New', Consolas, monospace;
      font-size: 13px;
      font-weight: bold;
      fill: #ff2a4b;
    }
    .badge {
      font-family: sans-serif;
      font-size: 10px;
      font-weight: bold;
      fill: #ff4d6d;
      letter-spacing: 1.5px;
    }
  </style>

  <!-- Card Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- Vinyl Record Group -->
  <g class="vinyl-disc">
    <!-- Outer Record -->
    <circle cx="75" cy="80" r="55" fill="#050507" stroke="#1f070a" stroke-width="2" />
    <!-- Grooves -->
    <circle cx="75" cy="80" r="46" fill="none" stroke="#121216" stroke-width="2" />
    <circle cx="75" cy="80" r="38" fill="none" stroke="#121216" stroke-width="2" />
    <circle cx="75" cy="80" r="30" fill="none" stroke="#121216" stroke-width="2" />
    <!-- Center Label (Crimson Blood Red) -->
    <circle cx="75" cy="80" r="20" fill="#990011" />
    <circle cx="75" cy="80" r="18" fill="#e60026" />
    <!-- Center Spindle Hole -->
    <circle cx="75" cy="80" r="5" fill="#0b0b0e" />
    <!-- Vinyl Shine Highlight -->
    <path d="M 35 40 Q 75 75 115 40 Q 75 75 35 40 Z" fill="#ffffff" opacity="0.12" />
  </g>

  <!-- Turntable Arm / Needle (Vampire Metallic Red Accent) -->
  <path d="M 140 30 L 110 65 L 90 68" fill="none" stroke="#ff2a4b" stroke-width="3" stroke-linecap="round" />
  <circle cx="140" cy="30" r="4" fill="#e60026" />
  <circle cx="90" cy="68" r="3" fill="#ff4d6d" />

  <!-- Track Information -->
  <text class="badge" x="165" y="42">♫ NOW PLAYING</text>
  <text class="title" x="165" y="66">Dracula 🩸</text>
  <text class="artist" x="165" y="86">Tame Impala</text>

  <!-- Equalizer Audio Visualizer Bars -->
  <g transform="translate(165, 0)">
    <rect class="eq-bar eq-1" x="0" y="110" width="5" height="10" rx="2" />
    <rect class="eq-bar eq-2" x="9" y="110" width="5" height="16" rx="2" />
    <rect class="eq-bar eq-3" x="18" y="110" width="5" height="24" rx="2" />
    <rect class="eq-bar eq-4" x="27" y="110" width="5" height="12" rx="2" />
    <rect class="eq-bar eq-5" x="36" y="110" width="5" height="20" rx="2" />
    <rect class="eq-bar eq-2" x="45" y="110" width="5" height="14" rx="2" />
    <rect class="eq-bar eq-1" x="54" y="110" width="5" height="26" rx="2" />
    <rect class="eq-bar eq-3" x="63" y="110" width="5" height="18" rx="2" />
  </g>
</svg>
